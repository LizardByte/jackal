{% assign share = page.share %}
{% if share == nil %}{% assign share = site.jackal.share %}{% endif %}
{% if share %}
  {% assign share_url = page.url | absolute_url | url_encode %}
  {% assign share_title = page.title | url_encode %}
  <nav class="jackal-share" aria-label="Share this post">
    <a href="https://bsky.app/intent/compose?text={{ share_title }}%20{{ share_url }}">Bluesky</a>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}">LinkedIn</a>
    <a href="mailto:?subject={{ share_title }}&amp;body={{ share_url }}">Email</a>
  </nav>
{% endif %}
