{% if include.actions.size > 0 %}
  <div class="jackal-actions">
    {% for jackal_action in include.actions %}
      <a class="jackal-button{% if jackal_action.primary %} jackal-button--primary{% endif %}"
         href="{% include jackal/url.html url=jackal_action.url scope=jackal_action.scope %}">
        {{- jackal_action.label | escape -}}
      </a>
    {% endfor %}
  </div>
{% endif %}
